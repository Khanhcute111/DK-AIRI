name: Build DK AIRI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: dk-airi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout DK AIRI build configuration
        uses: actions/checkout@v4

      - name: Checkout upstream AIRI source
        uses: actions/checkout@v4
        with:
          repository: moeru-ai/airi
          ref: main
          path: airi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: airi/pnpm-lock.yaml

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Apply DK AIRI branding
        working-directory: airi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/stage-pocket/android/app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<string name="app_name">AIRI</string>', '<string name="app_name">DK AIRI</string>')
          s = s.replace('<string name="title_activity_main">AIRI</string>', '<string name="title_activity_main">DK AIRI</string>')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install workspace dependencies
        working-directory: airi
        run: pnpm install --frozen-lockfile

      - name: Build shared AIRI packages
        working-directory: airi
        run: pnpm run build:packages

      - name: Build Stage Pocket web assets
        working-directory: airi
        run: pnpm -F @proj-airi/stage-pocket run build

      - name: Sync Capacitor Android project
        working-directory: airi
        run: pnpm -F @proj-airi/stage-pocket exec cap sync android

      - name: Build installable debug APK
        working-directory: airi/apps/stage-pocket/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload DK AIRI APK
        uses: actions/upload-artifact@v4
        with:
          name: DK-AIRI-debug-apk
          path: airi/apps/stage-pocket/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
